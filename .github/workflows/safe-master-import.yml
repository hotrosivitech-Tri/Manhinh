name: Protect master import UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make master import collapsed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<div class="card"><h3 style="margin:0 0 8px">📥 Nạp QLVTech hàng loạt</h3>')
          if start<0:
              raise SystemExit('master card not found')
          end=s.find('</div>\n<div class="card"><h3 style="margin:0 0 8px">Đã khai báo</h3>', start)
          if end<0:
              raise SystemExit('master card end not found')
          card=s[start:end]
          if '<details' not in card:
              card='<details style="margin:0"><summary style="cursor:pointer;font-weight:800;padding:4px 0">🔒 Cập nhật dữ liệu master QLVTech — chỉ mở khi cần</summary>'+card+'</details>\n'
              s=s[:start]+card+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Protect master import UI [skip ci]'
          git push
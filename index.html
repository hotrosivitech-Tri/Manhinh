<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhận diện màn hình Android</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700}.btn.on{background:#111827;color:#fff;border-color:#111827}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.zone{padding:16px 8px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-weight:800}.zone.on{background:#111827;color:#fff}.results{display:grid;gap:12px}.item{border:1px solid #e4e7ec;border-radius:14px;padding:12px}.item .top{display:flex;justify-content:space-between;gap:8px}.code{font-weight:800}.note{font-size:13px;color:#b42318;margin-top:8px}.view{width:100%;margin-top:10px;background:#2563eb;color:white;border:0;border-radius:10px;padding:11px;font-weight:700}.count{font-size:14px;font-weight:700}.hidden{display:none}.reset{background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:14px}.modalbox img{display:block;width:100%;max-height:80vh;object-fit:contain;border-radius:10px}.close{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body><main><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>Nhận diện màn Android</h1><div class="muted">Lọc nhanh từ hình dáng và mặt sau. Ảnh đối chiếu = mặt sau.</div></div><button class="reset" id="reset">Xóa lọc</button></div></div><div class="card"><h2>1. Camera</h2><div class="grid" id="cam"><button class="btn" data-v="none">Không lỗ</button><button class="btn" data-v="center">Giữa</button><button class="btn" data-v="left">Lệch trái</button><button class="btn" data-v="right">Lệch phải</button></div></div><div class="card"><h2>2. Hình dạng lỗ</h2><div class="grid" id="shape"><button class="btn" data-v="round">Tròn</button><button class="btn" data-v="bevel">Vát</button><button class="btn" data-v="other">Khác</button><button class="btn" data-v="skip">Bỏ qua</button></div></div><div class="card"><h2>3. Vị trí cáp — nhìn từ mặt sau</h2><div class="zones" id="zones"><button class="zone" data-v="11">11</button><button class="zone" data-v="12">12</button><button class="zone" data-v="13">13</button><button class="zone" data-v="21">21</button><button class="zone" data-v="22">22</button><button class="zone" data-v="23">23</button><button class="zone" data-v="31">31</button><button class="zone" data-v="32">32</button><button class="zone" data-v="33">33</button></div></div><div class="card hidden" id="more"><h2>4. Lọc thêm khi cần</h2><div class="grid" id="extra"><button class="btn" data-v="one">1 cáp</button><button class="btn" data-v="two">2 cáp</button><button class="btn" data-v="short">Có cáp ngắn</button><button class="btn" data-v="long">Có cáp dài</button><button class="btn" data-v="y">Cáp Y / chia đôi</button><button class="btn" data-v="skip">Bỏ qua</button></div></div><div class="card"><div class="count" id="count">0 ứng viên</div><div class="muted" id="hint">Chọn vài đặc điểm để thu hẹp danh sách.</div></div><div class="results" id="results"></div></main><div class="modal" id="modal"><div class="modalbox"><img id="modalImg" alt="Ảnh mặt sau màn"><button class="close" id="close">Đóng</button></div></div><script>const S={cam:null,shape:null,zone:null,extra:null};let products=[];const $=s=>document.querySelector(s);function pick(group,key,v){document.querySelectorAll('#'+group+' .btn,#'+group+' .zone').forEach(x=>x.classList.toggle('on',x.dataset.v===v));S[key]=v;render()}document.querySelectorAll('#cam .btn').forEach(b=>b.onclick=()=>pick('cam','cam',b.dataset.v));document.querySelectorAll('#shape .btn').forEach(b=>b.onclick=()=>pick('shape','shape',b.dataset.v));document.querySelectorAll('#zones .zone').forEach(b=>b.onclick=()=>{document.querySelectorAll('#zones .zone').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.zone=b.dataset.v;render()});document.querySelectorAll('#extra .btn').forEach(b=>b.onclick=()=>pick('extra','extra',b.dataset.v));$('#reset').onclick=()=>{Object.keys(S).forEach(k=>S[k]=null);document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));render()};function match(p){if(S.cam&&p.cam&&p.cam!==S.cam)return false;if(S.shape&&S.shape!=='skip'&&p.shape&&p.shape!==S.shape)return false;if(S.zone&&p.cablePositions&&p.cablePositions.length&&!p.cablePositions.includes(S.zone))return false;if(S.extra&&S.extra!=='skip'){if(S.extra==='one'&&p.cableCount!==1)return false;if(S.extra==='two'&&p.cableCount!==2)return false;if(S.extra==='short'&&!p.hasShort)return false;if(S.extra==='long'&&!p.hasLong)return false;if(S.extra==='y'&&!p.hasY)return false}return true}function render(){const arr=products.filter(match);$('#count').textContent=arr.length+' ứng viên';$('#more').classList.toggle('hidden',arr.length<=6);$('#hint').textContent=arr.length<=1?'Có thể chốt mã.':arr.length<=6?'Đã còn ít ứng viên — xem ảnh và ghi chú để chốt.':'Chọn thêm đặc điểm nếu cần.';$('#results').innerHTML=arr.slice(0,24).map(p=>`<div class=item><div class=top><div><div class=code>${p.code||''}</div><div>${p.name||''}</div></div></div>${p.note?`<div class=note>⚠ ${p.note}</div>`:''}<button class=view data-code="${p.code||''}">Xem ảnh mặt sau</button></div>`).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>openImg(b.dataset.code))}function openImg(code){$('#modalImg').src='images/'+encodeURIComponent(code)+'.jpg';$('#modal').classList.add('open')}$('#close').onclick=()=>$('#modal').classList.remove('open');fetch('data.json?'+Date.now()).then(r=>r.ok?r.json():[]).then(d=>{products=d;render()}).catch(()=>{products=[];render()});</script></body></html>
